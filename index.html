<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard TV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Nama User -->
    <div class="box user" id="username">Muhammad Nasrul Mahdi Ibnu Rowi</div>

    <!-- Mata Pelajaran -->
    <div class="box mapel">
        <h2>Mata Pelajaran</h2>
        <div id="mapelList"></div>
    </div>

    <!-- Jam -->
    <div class="box jam">
        <div class="gmt">GMT +7:00</div>
        <div id="clock">00:00:00</div>
    </div>

    <!-- Tanggal -->
    <div class="box tanggal" id="tanggal"></div>

    <!-- Cuaca -->
    <div class="box cuaca">
        <div id="suhu">Cuaca: --°C</div>
        <div id="kondisi">Loading...</div>
    </div>

    <!-- Adzan -->
    <div class="box adzan" id="adzan">
        Adzan Selanjutnya: Loading...
    </div>

</div>

<!-- Running Text -->
<div class="marquee">
    <div id="runningText">Selamat Datang Di Dashboard TV - Bisa Diganti Bebas 😈</div>
</div>

<script>
/* =========================
   1. JADWAL MAPEL OTOMATIS
========================= */
const jadwal = {
    1: ["Bahasa Indonesia", "Matematika", "IPS"],       // Senin
    2: ["Informatika", "Bahasa Inggris", "IPA"],        // Selasa
    3: ["Matematika", "IPS", "Bahasa Sunda"],           // Rabu
    4: ["IPA", "Bahasa Indonesia", "PJOK"],             // Kamis
    5: ["Informatika", "Matematika", "Agama"]           // Jumat
};

function tampilMapel() {
    const hari = new Date().getDay(); // Minggu=0
    const list = document.getElementById("mapelList");

    if (jadwal[hari]) {
        list.innerHTML = jadwal[hari].map(item => `<p>${item}</p>`).join("");
    } else {
        list.innerHTML = "<p>Libur 😴</p>";
    }
}
tampilMapel();

/* =========================
   2. JAM GMT+7
========================= */
function updateJam() {
    const now = new Date();

    const options = {
        timeZone: "Asia/Jakarta",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    };

    const jam = new Intl.DateTimeFormat("id-ID", options).format(now);
    document.getElementById("clock").innerText = jam;
}
setInterval(updateJam, 1000);
updateJam();

/* =========================
   3. TANGGAL GMT+7
========================= */
function updateTanggal() {
    const now = new Date();

    const options = {
        timeZone: "Asia/Jakarta",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    };

    const tanggal = new Intl.DateTimeFormat("id-ID", options).format(now);
    document.getElementById("tanggal").innerText = tanggal;
}
updateTanggal();

/* =========================
   4. CUACA LIVE CISARUA BOGOR
   Pakai Open-Meteo Gratis
========================= */
async function getCuaca() {
    try {
        // Koordinat Cisarua Bogor
        const url = "https://api.open-meteo.com/v1/forecast?latitude=-6.67&longitude=106.95&current_weather=true";
        const res = await fetch(url);
        const data = await res.json();

        const temp = data.current_weather.temperature;
        const code = data.current_weather.weathercode;

        let kondisi = "Cerah";

        if(code > 2) kondisi = "Berawan";
        if(code > 50) kondisi = "Hujan";

        document.getElementById("suhu").innerText = "Cuaca: " + temp + "°C";
        document.getElementById("kondisi").innerText = kondisi;

    } catch {
        document.getElementById("kondisi").innerText = "Gagal Load";
    }
}
getCuaca();
setInterval(getCuaca, 600000);

/* =========================
   5. ADZAN LIVE CISARUA
========================= */
async function getAdzan() {
    try {
        const now = new Date();
        const tgl = now.getDate();
        const bln = now.getMonth()+1;
        const thn = now.getFullYear();

        const url = `https://api.aladhan.com/v1/timingsByCity/${tgl}-${bln}-${thn}?city=Bogor&country=Indonesia&method=11`;

        const res = await fetch(url);
        const data = await res.json();
        const jadwal = data.data.timings;

        const waktu = [
            ["Subuh", jadwal.Fajr],
            ["Dzuhur", jadwal.Dhuhr],
            ["Ashar", jadwal.Asr],
            ["Maghrib", jadwal.Maghrib],
            ["Isya", jadwal.Isha]
        ];

        const sekarang = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Jakarta",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }).format(new Date());

        let next = "Besok Subuh";

        for(let item of waktu){
            if(sekarang < item[1]){
                next = item[0] + " " + item[1];
                break;
            }
        }

        document.getElementById("adzan").innerText =
            "Adzan Selanjutnya: " + next;

    } catch {
        document.getElementById("adzan").innerText =
            "Adzan Selanjutnya: Gagal Load";
    }
}
getAdzan();
setInterval(getAdzan, 600000);
</script>

</body>
</html>
